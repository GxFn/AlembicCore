name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-check:
    name: Build, lint, test, and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Core 是外层仓库共享底座，先保证类型契约、静态扫描、测试和可打包性。
      - name: TypeScript check
        run: npm run build:check

      - name: Lint
        run: npm run lint

      - name: Check public API boundary
        run: npm run lint:public-api-boundary

      - name: Test
        run: npm test

      - name: Build package output
        run: npm run build

      - name: Smoke test package entrypoints
        run: npm run smoke:public-api

      - name: Verify release package baseline
        run: npm run release:check
