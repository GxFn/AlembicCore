name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-check:
    name: Build, lint, test, and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 复用本地完整检查；check 内先构建 dist，再执行依赖编译产物的公共入口门禁。
      # 层依赖、scope、预算和退役符号等规则也必须在普通 PR 中生效。
      - name: Check, build, and test
        run: npm run check

      - name: Verify release package baseline
        run: npm run release:check
